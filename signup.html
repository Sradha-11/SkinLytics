<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - SkinLytics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="top-header">
  <div class="logo">
  <img src="logo.png" alt="SkinLytics Logo">
</div>
  <button onclick="goBack()">⬅ Back</button>
</header>

<!-- SIGNUP SECTION -->
<section class="section signup-section">
  <h2 class="signup-title">Create Account</h2>

  <div class="signup-container">
    <input type="text" id="name" placeholder="👤 Name">
    <input type="email" id="email" placeholder="📧 E-Mail">
    <input type="password" id="password" placeholder="🔒 Password">
    <input type="password" id="confirmPassword" placeholder="🔐 Confirm Password">

    <button onclick="handleSignup()" class="signup-btn">Sign Up</button>

    <div class="login-box" onclick="goToLogin()">
      Already a user? <span>Login</span>
    </div>
  </div>
</section>

<script src="script.js"></script>

<script>
function goBack() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
