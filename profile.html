<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile - SkinLytics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-header">
  <div class="logo">
  <img src="logo.png" alt="SkinLytics Logo">
</div>
  <button onclick="goBack()">⬅ Back</button>
</header>

<div class="about-page">

  <!-- PROFILE -->
  <section class="profile-card">

  <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="profile-img">

  <p><b>Name:</b> <span id="profileName">User Name</span></p>
  <p><b>Email:</b> <span id="profileEmail">user@email.com</span></p>
  <p><b>Age:</b> <span id="profileAge">22</span></p>
  <p><b>Skin Type:</b> <span id="profileSkinType">Oily</span></p>
  </div>

</section>

  <!-- ACCOUNT SETTINGS -->
  <section class="about-box">
  <h2>Account Settings</h2>

  <button onclick="goToEditProfile()">Edit Profile</button>
  <button onclick="goToChangePassword()">Change Password</button>
  <button onclick="goToSkinPreferences()">Update Skin Preferences</button>

</section>

  <!-- ACTIVITY -->
  <section class="about-box">
    <h2>Activity Summary</h2>
    <p>Images Uploaded: 10</p>
    <p>Videos Uploaded: 5</p>
    <p>AI Queries: 20</p>
    <p>Skin Analyses Done: 8</p>
  </section>

  <!-- SAVED -->
  <section class="about-box">
    <h2>Saved Data</h2>
    <p>Saved Suggestions</p>
    <p>Saved Products</p>
  </section>

  <!-- ACTIONS -->
  <section class="about-box">
    <h2>Actions</h2>
    <button onclick="downloadReport()">Download Report</button>
    <button onclick="clearData()">Clear Data</button>
  </section>

  <!-- LOGOUT -->
  <section class="about-box" style="text-align:center;">
    <button onclick="logout()" style="background:red;">Logout</button>
  </section>

</div>

<script src="script.js"></script>

<script>
function goBack() {
  window.location.href = "index.html";
}
</script>
<script>
window.onload = function() {
  const name = localStorage.getItem("name");
  const email = localStorage.getItem("email");
  const age = localStorage.getItem("age");
  const SkinType = localStorage.getItem("skinType");

  if (name) document.getElementById("profileName").innerText = name;
  if (email) document.getElementById("profileEmail").innerText = email;
  if (age) document.getElementById("profileAge").innerText = age;
  if (SkinType) document.getElementById("profileSkinType").innerText = age;
};
</script>

</body>
</html>
