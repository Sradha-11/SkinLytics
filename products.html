<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Products</title>

<style>
body{
  font-family: Arial;
  background:#f3e8ff;
  text-align:center;
  padding:40px;
}

.box{
  background:white;
  padding:20px;
  border-radius:12px;
  width:300px;
  margin:auto;
  box-shadow:0 4px 8px rgba(0,0,0,0.1);
}
</style>

</head>
<body>

<h2>Recommended Products</h2>

<div class="box">
  <img id="img" width="200"><br><br>
  <p id="products"></p>
</div>

<script>

function getSkinData(){
  const input = localStorage.getItem("aiInput") || "";
  const image = localStorage.getItem("aiImage");

  let type = "";
  const text = input.toLowerCase();

  if(text.includes("acne") || text.includes("pimple")){
    type = "acne";
  }
  else if(text.includes("dry")){
    type = "dry";
  }
  else if(text.includes("oily")){
    type = "oily";
  }
  else if(image){
    const arr = ["acne","dry","oily","normal"];
    type = arr[Math.floor(Math.random()*arr.length)];
  }
  else{
    type = "normal";
  }

  return { type, image };
}

// RUN
const data = getSkinData();

document.getElementById("img").src = data.image;

let products = "";

if(data.type === "acne"){
  products = "Cleanser: Cetaphil\nSerum: Salicylic Acid\nMoisturizer: Oil-Free\nSunscreen: SPF 50";
}
else if(data.type === "dry"){
  products = "Cleanser: Cream Cleanser\nSerum: Hyaluronic Acid\nMoisturizer: Nivea Cream";
}
else if(data.type === "oily"){
  products = "Cleanser: Foam Wash\nSerum: Niacinamide\nMoisturizer: Gel Based";
}
else{
  products = "Basic Products:\nCleanser\nMoisturizer\nSunscreen";
}

document.getElementById("products").innerText = products;

</script>

</body>
</html>
