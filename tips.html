<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skincare Tips</title>

<style>
body{
  font-family: Arial;
  background:#f3e8ff;
  text-align:center;
  padding:40px;
}

.box{
  background:white;
  padding:20px;
  border-radius:12px;
  width:300px;
  margin:auto;
  box-shadow:0 4px 8px rgba(0,0,0,0.1);
}
</style>

</head>
<body>

<h2>Skincare Tips</h2>

<div class="box">
  <img id="img" width="200"><br><br>
  <p id="tips"></p>
</div>

<script>

function getSkinData(){
  const input = localStorage.getItem("aiInput") || "";
  const image = localStorage.getItem("aiImage");

  let type = "";
  const text = input.toLowerCase();

  if(text.includes("acne") || text.includes("pimple")){
    type = "acne";
  }
  else if(text.includes("dry")){
    type = "dry";
  }
  else if(text.includes("oily")){
    type = "oily";
  }
  else if(image){
    const arr = ["acne","dry","oily","normal"];
    type = arr[Math.floor(Math.random()*arr.length)];
  }
  else{
    type = "normal";
  }

  return { type, image };
}

// RUN
const data = getSkinData();

document.getElementById("img").src = data.image;

let tips = "";

if(data.type === "acne"){
  tips = "• Do not touch face\n• Drink water\n• Avoid oily food";
}
else if(data.type === "dry"){
  tips = "• Use moisturizer\n• Avoid hot water\n• Stay hydrated";
}
else if(data.type === "oily"){
  tips = "• Wash face twice\n• Use oil-free products\n• Avoid junk food";
}
else{
  tips = "• Maintain routine\n• Use sunscreen daily";
}

document.getElementById("tips").innerText = tips;

</script>

</body>
</html>
