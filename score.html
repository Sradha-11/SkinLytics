<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Score</title>

<style>
body{
  font-family: Arial;
  background:#f3e8ff;
  text-align:center;
  padding:40px;
}

.box{
  background:white;
  padding:20px;
  border-radius:12px;
  width:300px;
  margin:auto;
  box-shadow:0 4px 8px rgba(0,0,0,0.1);
}
</style>

</head>
<body>

<h2>Skin Health Score</h2>

<div class="box">
  <img id="img" width="200"><br><br>
  <p id="score"></p>
</div>

<script>

function getSkinData(){
  const input = localStorage.getItem("aiInput") || "";
  const image = localStorage.getItem("aiImage");

  let type = "";
  const text = input.toLowerCase();

  if(text.includes("acne") || text.includes("pimple")){
    type = "acne";
  }
  else if(text.includes("dry")){
    type = "dry";
  }
  else if(text.includes("oily")){
    type = "oily";
  }
  else if(image){
    const arr = ["acne","dry","oily","normal"];
    type = arr[Math.floor(Math.random()*arr.length)];
  }
  else{
    type = "normal";
  }

  return { type, image };
}

// RUN
const data = getSkinData();

document.getElementById("img").src = data.image;

const score = 60 + Math.floor(Math.random()*30);

document.getElementById("score").innerText =
"Skin Score: " + score + "/100\nType: " + data.type.toUpperCase();

</script>

</body>
</html>
